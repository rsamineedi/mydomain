<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rukminipriya.in — Coming Soon</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 20% 20%, #2a1a4a 0%, #0b0b14 45%, #05050a 100%);
    color: #f5f5f7;
    overflow: hidden;
    position: relative;
  }

  .glow {
    position: absolute;
    width: 60vmax;
    height: 60vmax;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(139,92,246,0.25) 0%, rgba(139,92,246,0) 70%);
    top: -20vmax;
    right: -20vmax;
    filter: blur(10px);
    animation: drift 12s ease-in-out infinite alternate;
  }
  @keyframes drift {
    to { transform: translate(-4vmax, 4vmax) scale(1.05); }
  }

  .wrap {
    position: relative;
    text-align: center;
    padding: 2.5rem 2rem;
    z-index: 1;
  }

  .badge {
    display: inline-block;
    padding: 0.35rem 0.9rem;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.05);
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #c4b5fd;
    margin-bottom: 1.5rem;
  }

  h1 {
    font-size: clamp(2.2rem, 7vw, 4rem);
    margin: 0 0 0.75rem;
    letter-spacing: -0.03em;
    background: linear-gradient(135deg, #fff 20%, #c4b5fd 80%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  p.sub {
    font-size: clamp(1rem, 2vw, 1.2rem);
    color: #a1a1aa;
    margin: 0 auto 2rem;
    max-width: 32rem;
    line-height: 1.5;
  }

  .domain {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.95rem;
    color: #71717a;
    letter-spacing: 0.02em;
  }

  .dots {
    display: inline-flex;
    gap: 0.35rem;
    margin-left: 0.4rem;
    vertical-align: middle;
  }
  .dots span {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #8b5cf6;
    animation: pulse 1.4s ease-in-out infinite;
  }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.25; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <div class="wrap">
    <span class="badge">Launching Soon</span>
    <h1>Coming Soon</h1>
    <p class="sub">We're putting the finishing touches on something new. Check back shortly.</p>
    <div class="domain">
      rukminipriya.in
      <span class="dots" aria-hidden="true"><span></span><span></span><span></span></span>
    </div>
  </div>
</body>
</html>
